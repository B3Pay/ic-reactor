<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<title>IC Reactor</title>
<style>
.iri-flash { opacity: 0; transform-box: fill-box; transform-origin: center; animation: iri-flash 3.4s linear both; }
@keyframes iri-flash { 0% { opacity: 0; transform: scale(.7); } 14.706% { opacity: 0; transform: scale(.7); animation-timing-function: ease-out; } 27.941% { opacity: 1; transform: scale(1); } 35.294% { opacity: 1; animation-timing-function: ease-in-out; } 55.882% { opacity: 0; transform: scale(1); } 100% { opacity: 0; } }
.iri-chamber { transform-box: fill-box; transform-origin: center; animation: iri-chamber 3.4s linear both; }
@keyframes iri-chamber { 0% { opacity: 0; transform: scale(.45); } 10.294% { opacity: 0; transform: scale(.45); } 27.941% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }
.iri-wave { opacity: 0; transform-box: fill-box; transform-origin: center; animation: iri-wave 3.4s linear both; }
@keyframes iri-wave { 0% { opacity: 0; transform: scale(0.283); stroke-width: 10.615; } 10.294% { opacity: 0; transform: scale(0.283); stroke-width: 10.615; } 18.382% { opacity: 0.8; transform: scale(0.462); stroke-width: 5.52; } 26.471% { opacity: 0.6; transform: scale(0.641); stroke-width: 3.275; } 34.559% { opacity: 0.3; transform: scale(0.821); stroke-width: 2.011; } 42.647% { opacity: 0; transform: scale(1); stroke-width: 1.2; } 100% { opacity: 0; } }
.iri-hum { opacity: 0; transform-box: fill-box; transform-origin: center; animation: iri-hum 3.4s linear both; }
@keyframes iri-hum { 0% { opacity: 0; transform: scale(0.283); stroke-width: 4.246; } 52.941% { opacity: 0; transform: scale(0.283); stroke-width: 4.246; } 64.706% { opacity: 0.34; transform: scale(0.462); stroke-width: 2.598; } 76.471% { opacity: 0.22; transform: scale(0.641); stroke-width: 1.871; } 88.235% { opacity: 0.1; transform: scale(0.821); stroke-width: 1.462; } 100% { opacity: 0; transform: scale(1); stroke-width: 1.2; } }
.iri-link { stroke-dasharray: 194.779; animation: iri-link 3.4s linear both; }
@keyframes iri-link { 0% { stroke-dashoffset: 194.779; opacity: 1; } 32.353% { stroke-dashoffset: 194.779; animation-timing-function: ease-in-out; } 52.941% { stroke-dashoffset: 0; opacity: 1; animation-timing-function: ease-in-out; } 76.471% { opacity: .7; animation-timing-function: ease-in-out; } 100% { stroke-dashoffset: 0; opacity: 1; } }
.iri-block { animation: iri-block 3.4s linear both; }
@keyframes iri-block { 0% { fill: #f1ede6; opacity: 0.28; } 20.588% { fill: #f1ede6; opacity: 0.28; animation-timing-function: ease-out; } 25% { fill: #f0b35a; opacity: 1; } 30.882% { fill: #f0b35a; opacity: 1; animation-timing-function: ease-in-out; } 44.118% { fill: #f1ede6; opacity: 1; } 100% { fill: #f1ede6; opacity: 1; } }
.iri-node { transform-box: fill-box; transform-origin: center; animation: iri-node 3.4s linear both; }
@keyframes iri-node { 0% { fill: #3a2c17; transform: scale(.92); } 5.882% { fill: #3a2c17; transform: scale(.92); animation-timing-function: ease-out; } 12.353% { fill: #f0b35a; transform: scale(1.18); animation-timing-function: ease-in-out; } 22.059% { fill: #f0b35a; transform: scale(1); } 52.941% { transform: scale(1); animation-timing-function: ease-in-out; } 76.471% { transform: scale(1.06); animation-timing-function: ease-in-out; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .iri-flash, .iri-wave, .iri-hum { animation: none; } .iri-chamber, .iri-link { animation: iri-rm-fade 2.4s ease both; } .iri-block { animation: iri-rm-block 2.4s ease both; } .iri-node { animation: iri-rm-node 2.4s ease both; } @keyframes iri-rm-fade { from { opacity: 0; } } @keyframes iri-rm-block { from { opacity: 0.28; } } @keyframes iri-rm-node { from { fill: #3a2c17; } } }
</style>
<g id="Hero">
<circle class="iri-flash" cx="48" cy="48" r="45" fill="#3a2c17" fill-opacity="0.55"/><circle class="iri-chamber" cx="48" cy="48" r="31" fill="#3a2c17"/><circle class="iri-wave" cx="48" cy="48" r="46" fill="none" stroke="#f0b35a" stroke-width="1.2"/><circle class="iri-hum" cx="48" cy="48" r="46" fill="none" stroke="#f0b35a" stroke-width="1.2"/><circle class="iri-link" cx="48" cy="48" r="31" fill="none" stroke="#f1ede6" stroke-width="1.5" transform="rotate(-90 48 48)"/><rect x="35.25" y="12" width="25.5" height="12" rx="3" class="iri-block" fill="#f1ede6"/><rect x="35.25" y="12" width="25.5" height="12" rx="3" class="iri-block" fill="#f1ede6" transform="rotate(60 48 48)"/><rect x="35.25" y="12" width="25.5" height="12" rx="3" class="iri-block" fill="#f1ede6" transform="rotate(120 48 48)"/><rect x="35.25" y="12" width="25.5" height="12" rx="3" class="iri-block" fill="#f1ede6" transform="rotate(180 48 48)"/><rect x="35.25" y="12" width="25.5" height="12" rx="3" class="iri-block" fill="#f1ede6" transform="rotate(240 48 48)"/><rect x="35.25" y="12" width="25.5" height="12" rx="3" class="iri-block" fill="#f1ede6" transform="rotate(300 48 48)"/><circle class="iri-node" cx="48" cy="48" r="13" fill="#f0b35a"/>
</g>
</svg>
