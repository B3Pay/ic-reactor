name: Release Tools

on:
  push:
    tags:
      - "tools-v*"
      - "parser-v*"

permissions:
  contents: read

concurrency:
  # Keyed per tag, NOT per lane. A shared group serialises publishes, but GitHub
  # keeps only ONE run pending per group: when a third run arrives, the run that
  # was already waiting is cancelled outright. Pushing parser-v*, tools-v* and v*
  # back to back therefore silently dropped the middle release.
  #
  # Ordering across lanes is enforced where it actually matters instead -- the
  # release-tools matrix publishes parser before its dependents with
  # max-parallel: 1 and fail-fast: true, and codegen's pinned parser version is
  # asserted to exist on npm before it publishes.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The matrix used to be an unconditional 4-way fan-out on BOTH tag prefixes, so
  # cutting `parser-v0.4.7` also published codegen, vite-plugin and cli -- whatever
  # state their manifests happened to be in. Derive the targets from the tag instead.
  setup:
    name: Resolve release targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workspaces: ${{ steps.resolve.outputs.workspaces }}
      assert: ${{ steps.resolve.outputs.assert }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          REF="${GITHUB_REF##*/}"
          case "$REF" in
            parser-v*)
              # parser only.
              WS='["packages/parser"]'
              ASSERT='packages/parser'
              VERSION="${REF#parser-v}" ;;
            tools-v*)
              # parser first: @ic-reactor/codegen pins it exactly, so it must exist on
              # the registry before codegen publishes. Already-published versions are
              # skipped by the guard in the publish step.
              WS='["packages/parser","packages/codegen","packages/vite-plugin","packages/cli"]'
              # parser is deliberately NOT asserted here: it rides a tools tag only so
              # codegen's exact pin resolves, and it carries its own version line.
              ASSERT='packages/codegen packages/vite-plugin packages/cli'
              VERSION="${REF#tools-v}" ;;
            *)
              echo "::error::Unrecognized release tag: $REF"; exit 1 ;;
          esac
          echo "Tag $REF -> $WS (assert $ASSERT at $VERSION)"
          echo "workspaces=$WS" >> "$GITHUB_OUTPUT"
          echo "assert=$ASSERT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The tools lane published with no verification at all: ci.yml and e2e.yml have no
  # `tags:` trigger, so a `tools-v*` or `parser-v*` tag pushed at any commit shipped
  # straight to npm with valid provenance. This mirrors release.yml's preflight so
  # both lanes are gated the same way.
  #
  # LIMITATION: Actions loads the workflow file from the revision the tag points at,
  # so this job runs only for tags on commits that already contain it. Tagging a
  # commit from before this landed runs THAT commit's workflow, which has no
  # preflight. release.yml has the same property, and no in-workflow check can close
  # it -- whoever chooses the commit also chooses the workflow that runs.
  #
  # The durable control is a repository ruleset restricting who may create `v*`,
  # `tools-v*` and `parser-v*` tags. Rulesets are enforced from repository settings
  # regardless of what any workflow file at any revision says. Treat this job as
  # defence against mistakes, and the ruleset as the boundary against a hostile tag.
  preflight:
    name: Preflight
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Tag must be an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Refusing to publish."
            exit 1
          fi

      - name: Tag version must match package manifests
        env:
          ASSERT_PACKAGES: ${{ needs.setup.outputs.assert }}
          EXPECTED: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          echo "Tag version: $EXPECTED"
          for pkg in $ASSERT_PACKAGES; do
            ACTUAL="$(node -p "require('./$pkg/package.json').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$pkg is at $ACTUAL but the tag says $EXPECTED."
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build, type check and test
        run: |
          set -euo pipefail
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Verify published artifacts
        run: pnpm verify:packages

  # One approval for the whole release. The `npm-publish` environment carries a
  # required reviewer and a deployment tag policy (v*, tools-v*, parser-v*) in
  # repo settings. Preflight gates correctness and the `Release tags` ruleset
  # gates who can create the tag; this is the only gate on the publish itself.
  # npm versions are immutable, so a wrong publish can only be superseded.
  # Self-approval is allowed, so for a solo maintainer it is a confirmation
  # step, not a second-person requirement. Like preflight, it is read from the
  # tagged revision: the tag policy is the part that holds regardless.
  #
  # It is its own job rather than a key on `release` because the publish
  # matrix runs with max-parallel: 1, and an environment on a matrix job asks
  # for approval once per leg as each one starts -- three prompts for v*.
  approve:
    name: Approve publish
    needs: [setup, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    steps:
      - name: Approved
        run: echo "Publishing ${GITHUB_REF_NAME} was approved."

  release:
    name: Release to npm
    needs: [setup, preflight, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      # A dependency leg that fails must stop the dependents from publishing against
      # a version that will never exist on the registry.
      fail-fast: true
      matrix:
        workspace: ${{ fromJson(needs.setup.outputs.workspaces) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Upgrade npm to v11 (required for OIDC)
        run: npm i -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        # install only package workspaces and their dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/**..."

      # Build the selected package and its dependency graph.
      - name: Build packages
        run: pnpm -r --filter "{./${{ matrix.workspace }}}..." build

      - name: Run tests
        run: pnpm -r --filter "{./${{ matrix.workspace }}}" test

      - name: Determine publish tag
        run: |
          # Determine publish tag based on the git tag name.
          # Default to 'latest' for stable tags (e.g., v3.0.0). If tag contains a hyphen (e.g., v3.0.0-beta.1), use 'beta'.
          REF=${GITHUB_REF##*/}
          echo "Detected tag: $REF"
          # Only treat tags with explicit prerelease identifiers as beta
          # (e.g. v1.2.3-beta.1). A generic hyphen appears in our tag
          # prefixes like "tools-v1.2.3" so checking for any hyphen
          # incorrectly marked stable releases as beta.
          if [[ "$REF" == *-beta* || "$REF" == *-alpha* || "$REF" == *-rc* ]]; then
            echo "TAG=beta" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      - name: Publish to npm (uses npm CLI for OIDC)
        # pnpm pack converts workspace:^ to real versions, then npm publish for OIDC auth
        working-directory: ${{ matrix.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          # pnpm pack rewrites `workspace:*` to an EXACT version, so a dependency
          # that is not yet on the registry makes this package permanently
          # uninstallable -- npm versions are immutable, so recovery means bumping
          # everything again. The matrix orders parser first, but that only holds
          # within a single run; assert it rather than assume it.
          for DEP in $(node -p "
            const d = require('./package.json').dependencies || {};
            Object.keys(d).filter((k) => k.startsWith('@ic-reactor/')).join('\n')
          "); do
            DEP_DIR="${DEP#@ic-reactor/}"
            DEP_VERSION=$(node -p "require('${GITHUB_WORKSPACE}/packages/${DEP_DIR}/package.json').version")
            if ! npm view "${DEP}@${DEP_VERSION}" version > /dev/null 2>&1; then
              echo "::error::$PACKAGE_NAME depends on ${DEP}@${DEP_VERSION}, which is not on npm."
              echo "::error::Publishing now would ship a package nobody can install. Release ${DEP} first."
              exit 1
            fi
            echo "dependency ${DEP}@${DEP_VERSION} is on npm"
          done

          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION exists on npm..."

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published. Skipping."
          else
            # Pack first - this converts workspace:^ to actual versions
            TARBALL=$(pnpm pack | tail -1)
            if [ -z "$TARBALL" ] || [ ! -s "$TARBALL" ]; then
              echo "::error::pnpm pack produced no tarball; refusing to publish."
              exit 1
            fi
            echo "Publishing tarball: $TARBALL"
            # Publish the tarball (npm for OIDC support)
            npm publish "$TARBALL" --access public --tag "$TAG"
          fi

      - name: Create GitHub Release
        if: |
          (startsWith(github.ref_name, 'parser-v') && matrix.workspace == 'packages/parser') ||
          (startsWith(github.ref_name, 'tools-v') && matrix.workspace == 'packages/codegen')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
