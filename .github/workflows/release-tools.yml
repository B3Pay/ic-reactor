name: Release Tools

on:
  push:
    tags:
      - "tools-v*"
      - "parser-v*"

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  # The matrix used to be an unconditional 4-way fan-out on BOTH tag prefixes, so
  # cutting `parser-v0.4.7` also published codegen, vite-plugin and cli -- whatever
  # state their manifests happened to be in. Derive the targets from the tag instead.
  setup:
    name: Resolve release targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      workspaces: ${{ steps.resolve.outputs.workspaces }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          REF="${GITHUB_REF##*/}"
          case "$REF" in
            parser-v*)
              # parser only.
              WS='["packages/parser"]' ;;
            tools-v*)
              # parser first: @ic-reactor/codegen pins it exactly, so it must exist on
              # the registry before codegen publishes. Already-published versions are
              # skipped by the guard in the publish step.
              WS='["packages/parser","packages/codegen","packages/vite-plugin","packages/cli"]' ;;
            *)
              echo "::error::Unrecognized release tag: $REF"; exit 1 ;;
          esac
          echo "Tag $REF -> $WS"
          echo "workspaces=$WS" >> "$GITHUB_OUTPUT"

  release:
    name: Release to npm
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      # A dependency leg that fails must stop the dependents from publishing against
      # a version that will never exist on the registry.
      fail-fast: true
      matrix:
        workspace: ${{ fromJson(needs.setup.outputs.workspaces) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Upgrade npm to v11 (required for OIDC)
        run: npm i -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        # install only package workspaces and their dependency graph
        run: pnpm install --frozen-lockfile --filter "./packages/**..."

      # Build the selected package and its dependency graph.
      - name: Build packages
        run: pnpm -r --filter "{./${{ matrix.workspace }}}..." build

      - name: Run tests
        run: pnpm -r --filter "{./${{ matrix.workspace }}}" test

      - name: Determine publish tag
        run: |
          # Determine publish tag based on the git tag name.
          # Default to 'latest' for stable tags (e.g., v3.0.0). If tag contains a hyphen (e.g., v3.0.0-beta.1), use 'beta'.
          REF=${GITHUB_REF##*/}
          echo "Detected tag: $REF"
          # Only treat tags with explicit prerelease identifiers as beta
          # (e.g. v1.2.3-beta.1). A generic hyphen appears in our tag
          # prefixes like "tools-v1.2.3" so checking for any hyphen
          # incorrectly marked stable releases as beta.
          if [[ "$REF" == *-beta* || "$REF" == *-alpha* || "$REF" == *-rc* ]]; then
            echo "TAG=beta" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      - name: Publish to npm (uses npm CLI for OIDC)
        # pnpm pack converts workspace:^ to real versions, then npm publish for OIDC auth
        working-directory: ${{ matrix.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION exists on npm..."

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME is already published. Skipping."
          else
            # Pack first - this converts workspace:^ to actual versions
            TARBALL=$(pnpm pack | tail -1)
            if [ -z "$TARBALL" ] || [ ! -s "$TARBALL" ]; then
              echo "::error::pnpm pack produced no tarball; refusing to publish."
              exit 1
            fi
            echo "Publishing tarball: $TARBALL"
            # Publish the tarball (npm for OIDC support)
            npm publish "$TARBALL" --access public --tag "$TAG"
          fi

      - name: Create GitHub Release
        if: |
          (startsWith(github.ref_name, 'parser-v') && matrix.workspace == 'packages/parser') ||
          (startsWith(github.ref_name, 'tools-v') && matrix.workspace == 'packages/codegen')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
