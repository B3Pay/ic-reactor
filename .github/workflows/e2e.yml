name: E2E Tests

on:
  # main is the 3.x line and v4 the 4.x development line; see ci.yml.
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so a compromised release cannot run its install script in CI, and so a
  # regression is traceable to a version. Bump deliberately.
  ICP_CLI_VERSION: 1.2.0
  IC_WASM_VERSION: 0.11.1

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # icp deploy builds the Rust hello_actor canister (e2e/icp.yaml).
      - name: Setup Rust for the hello_actor canister build
        uses: ./.github/actions/setup-rust-wasm

      # e2e/package.json pins the same two versions as devDependencies, and
      # e2e/test.sh puts e2e/node_modules/.bin first on PATH, so the suite runs
      # those copies, here as locally. The global install is a fallback only.
      # The next step fails when the two drift, so bump both places together.
      - name: Install icp-cli and ic-wasm
        run: npm install -g @icp-sdk/icp-cli@${{ env.ICP_CLI_VERSION }} @icp-sdk/ic-wasm@${{ env.IC_WASM_VERSION }}

      - name: Confirm the global tools match e2e/package.json
        run: |
          check() {
            pinned="$(node -p "require('./e2e/package.json').devDependencies['$1']")"
            actual="$($2 --version | awk '{ print $2 }')"
            echo "$2 $actual (e2e/package.json pins $pinned)"
            if [ "$actual" != "$pinned" ]; then
              echo "::error::the global $2 is $actual, but e2e/package.json pins $1 $pinned. Bump ICP_CLI_VERSION / IC_WASM_VERSION and e2e/package.json together."
              exit 1
            fi
          }
          check @icp-sdk/icp-cli icp
          check @icp-sdk/ic-wasm ic-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run e2e tests
        run: |
          cd e2e
          bash ./test.sh
