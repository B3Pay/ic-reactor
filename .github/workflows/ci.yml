name: CI

on:
  # main is the 3.x line (security fixes only until 4.0 GA) and v4 the 4.x
  # development line. A run uses the workflow file of its own ref, so each
  # line's CI is the one on its own branch.
  push:
    branches: [main, v4]
  pull_request:
    branches: [main, v4]

permissions:
  contents: read

concurrency:
  # Only collapse runs for the same pull request. Keying on github.ref made every
  # push to main share one group, so back-to-back merges cancelled each other and
  # left commits on main with no completed CI run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Format check
        run: pnpm format:check

      - name: AI context check
        run: pnpm check:ai-context

      - name: Build packages
        run: pnpm build

      # The public surface is the plan in scripts/export-budget.mjs and no
      # more: it reads the declarations just built and fails on a name the
      # plan does not list, on more names than an entry's cap, on a name two
      # entries export, on a name @candid-core/schema or TanStack Query
      # already exports (D35: one import path per name), and on an `exports`
      # subpath or a publishable package the plan has no entry for.
      - name: Export budget
        run: pnpm check:exports

      # Compiles every ts/tsx fence of the AI guides, the skills and the
      # READMEs against the declarations just built, the API an agent in a
      # consumer project pastes them against. check:ai-context keeps their
      # versions and links current but compiles nothing. Every file of
      # scripts/ai-context-files.js is in its set, so a guide is compiled the
      # commit it lands.
      - name: Snippet check
        run: pnpm check:snippets

      - name: Type check
        run: pnpm typecheck

      # Every `@ts-expect-error` of packages/core/tests/traps.test-d.ts is a
      # guarantee of the types. A directive goes unused when a refactor widens
      # the type, and nothing in a green typecheck says so, so each trap is
      # removed on purpose in a copy of the package and tsc must report
      # exactly that directive as unused (TS2578).
      - name: Trap types
        run: pnpm verify:traps

      # Type-aware rules read @ic-reactor/core's emitted .d.ts through the
      # workspace symlinks, so this must run after `pnpm build` -- without a
      # build those types degrade to `any` and no-floating-promises silently
      # stops reporting. Placed after Type check so a type error surfaces as
      # tsc's message rather than an ESLint parse error.
      - name: Lint
        run: pnpm lint

  typecheck-examples:
    name: Type Check Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Examples import the @ic-reactor/* packages through the workspace symlinks,
      # so they must be built before type-checking the examples.
      - name: Build packages
        run: pnpm build

      - name: Type check examples
        run: pnpm typecheck:examples

      # Compiles the ts/tsx fences of the docs site's hand-written pages. Their
      # examples import libraries only the example apps install, which is why
      # this runs here, where the examples are installed and the packages
      # built, and not in the lint job that installs without them.
      - name: Docs snippet check
        run: pnpm check:snippets:docs

      # `tsc` never loads a bundler, so a broken Vite/Next config type-checks
      # clean. examples/nextjs (Turbopack workspace root) and
      # examples/nextjs-app-router (Tailwind v4 PostCSS plugin) were both
      # unbuildable while this job stayed green -- issue #224.
      - name: Build examples
        run: pnpm build:examples

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # The gates' own tests: the export budget, the trap verifier, the fault
      # verifier, check:ai-context and check:snippets each run against
      # repositories built for the purpose and must fail where they should.
      # They compile against the packages built above.
      - name: Test the gates
        run: pnpm test:scripts

      # A test that stays green with its bug put back guards nothing. Each
      # test listed in scripts/faults.json is run against a copy of its
      # package with the named fault applied and must fail.
      - name: Fault-proof runtime tests
        run: pnpm verify:faults

      # Everything above runs against the lockfile, which holds the newest
      # release of each peer. This pins core's and react's peers to the lowest
      # versions their ranges accept and runs typecheck and tests there, in a
      # throwaway worktree. react once declared @tanstack/react-query ^5.0.0
      # while it did not compile below 5.89 (#475). It also compiles the
      # declarations built above with the oldest supported TypeScript: the docs
      # said TypeScript 5+ while the declarations needed 5.7 (#591).
      - name: Test at the oldest supported peers and TypeScript
        run: pnpm verify:peer-floors

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Build packages
        run: pnpm build

      - name: Check package sizes
        run: pnpm size

      - name: Verify published artifacts
        # Packs every publishable package, installs the tarballs into a scratch
        # project outside the workspace, imports/requires every entry point in real
        # Node, and runs publint + attw. In-repo consumers reach packages through
        # workspace symlinks and bundler-mode resolution, so nothing else in CI can
        # catch a broken published artifact -- which is how 3.7.0 shipped
        # extensionless ESM specifiers and a cli `types` entry that was never built.
        run: pnpm verify:packages
