name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only collapse runs for the same pull request. Keying on github.ref made every
  # push to main share one group, so back-to-back merges cancelled each other and
  # left commits on main with no completed CI run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust for the parser wasm build
        uses: ./.github/actions/setup-rust-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Format check
        run: pnpm format:check

      - name: AI context check
        run: pnpm check:ai-context

      - name: Build packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      # Type-aware rules read @ic-reactor/core's emitted .d.ts through the
      # workspace symlinks, so this must run after `pnpm build` -- without a
      # build those types degrade to `any` and no-floating-promises silently
      # stops reporting. Placed after Type check so a type error surfaces as
      # tsc's message rather than an ESLint parse error.
      - name: Lint
        run: pnpm lint

  typecheck-examples:
    name: Type Check Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust for the parser wasm build
        uses: ./.github/actions/setup-rust-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Examples import the @ic-reactor/* packages through the workspace symlinks,
      # so they must be built before type-checking the examples.
      - name: Build packages
        run: pnpm build

      - name: Type check examples
        run: pnpm typecheck:examples

      # `tsc` never loads a bundler, so a broken Vite/Next config type-checks
      # clean. examples/nextjs (Turbopack workspace root) and
      # examples/nextjs-app-router (Tailwind v4 PostCSS plugin) were both
      # unbuildable while this job stayed green -- issue #224.
      - name: Build examples
        run: pnpm build:examples

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust for the parser wasm build
        uses: ./.github/actions/setup-rust-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust for the parser wasm build
        uses: ./.github/actions/setup-rust-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Build packages
        run: pnpm build

      - name: Check package sizes
        run: pnpm size

      - name: Verify published artifacts
        # Packs every publishable package, installs the tarballs into a scratch
        # project outside the workspace, imports/requires every entry point in real
        # Node, and runs publint + attw. In-repo consumers reach packages through
        # workspace symlinks and bundler-mode resolution, so nothing else in CI can
        # catch a broken published artifact -- which is how 3.7.0 shipped
        # extensionless ESM specifiers and a cli `types` entry that was never built.
        run: pnpm verify:packages
