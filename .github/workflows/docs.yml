name: Deploy Docs

# The 4.x line's docs deploy, from main. A Pages deploy replaces the whole
# site, so each deploy carries every line (scripts/assemble-docs-site.mjs):
#
# - /v4/ built from this commit;
# - /v3/ rebuilt from the v3 branch on every deploy, with v3's llms.txt and
#   llms-full.txt beside it (option A of the 4.0 GA flip; the owner's to
#   overturn). The v3 branch has no docs deploy of its own. A 3.x docs build
#   that fails blocks the deploy: fix it on v3, or switch to option B;
# - /v2/, the static 2.x site kept from gh-pages;
# - the root: / and the 404 page go to /v4/, /llms.txt is the 4.x guide
#   (packages/core/llms.txt), and /llms-full.txt stays the frozen 3.x file.
#
# Option B, a static /v3/ snapshot: commit one 3.x build to gh-pages:v3/
# (with Pages' source set to GitHub Actions first, or that push starts a
# legacy Pages build that replaces the site), delete the two v3 steps below,
# drop --v3-line from the assembly step, and point --root-llms-full at
# existing-pages/v3/llms-full.txt (or drop it to serve no /llms-full.txt). The
# assembly then keeps gh-pages' /v3/ and refuses to publish without one.
#
# A push to v3 deploys nothing: after a 3.x docs fix, run this workflow by hand
# on main (workflow_dispatch) to republish /v3/.
#
# Deploying from main needs main in the github-pages environment's deployment
# branch policy (repo settings).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
      - "scripts/assemble-docs-site.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation (Astro)
        run: pnpm docs:build

      # Advisory here, not blocking: `deploy` has `needs: build`, so failing
      # would stop the site updating at all rather than publishing one dead
      # link. The PR gate in docs-check.yml is the hard one.
      - name: Check links
        continue-on-error: true
        run: pnpm docs:check-links

      # docs/dist should be Astro static output

      # The 3.x docs, rebuilt from the v3 branch on every deploy (option A), so
      # a deploy republishes /v3/ instead of dropping it.
      - name: Check out the 3.x line (v3)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v3
          path: v3-line

      - name: Build the 3.x documentation
        working-directory: v3-line
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter '!./examples/**'
          pnpm docs:build

      - name: Download existing Pages content
        id: existing-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: existing-pages
        # gh-pages does not exist on the very first deploy. A failure here is only
        # tolerable in that case; the guard below turns any other failure into an error
        # instead of silently publishing a site whose /v2 URLs all 404.
        continue-on-error: true

      - name: Merge existing + new docs
        run: |
          set -euo pipefail
          if [ ! -d "existing-pages" ] && git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::error::gh-pages exists remotely but could not be checked out." \
                 "Refusing to publish, which would drop every previously published version."
            exit 1
          fi
          node scripts/assemble-docs-site.mjs \
            --out final-docs \
            --existing existing-pages \
            --v4 docs/dist \
            --v3-line v3-line \
            --root-llms packages/core/llms.txt \
            --root-llms-full v3-line/llms-full.txt \
            --cname CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: final-docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The only job that needs the Pages OIDC token; its sole step is
    # actions/deploy-pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
