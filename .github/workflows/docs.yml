name: Deploy Docs

# The v4 line's copy of this workflow. Until 4.0 GA the site carries two built
# lines: /v3/ from main and /v4/ from v4 (plus the static /v2/). A Pages deploy
# replaces the whole site, so each deploy has to carry both lines. This one
# builds /v4/ from its own commit and rebuilds /v3/ from main, as main's own
# deploy builds it, and leaves the site root (index.html, llms.txt,
# llms-full.txt) to the 3.x line until GA.
#
# Known gap until GA: main's copy of this workflow publishes /v3/ only and
# removes /v4/, so a docs deploy from main drops /v4/ until the next v4 deploy
# (push to v4 or run this workflow by hand). Deploying from v4 also needs v4 in
# the github-pages environment's deployment branch policy (repo settings).
on:
  push:
    branches: [v4]
    paths:
      - "docs/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation (Astro)
        run: pnpm docs:build

      # Advisory here, not blocking: `deploy` has `needs: build`, so failing
      # would stop the site updating at all rather than publishing one dead
      # link. The PR gate in docs-check.yml is the hard one.
      - name: Check links
        continue-on-error: true
        run: pnpm docs:check-links

      # docs/dist should be Astro static output

      # The 3.x docs, built from main exactly as main's deploy builds them, so a
      # v4 deploy republishes /v3/ unchanged instead of dropping it.
      - name: Check out the 3.x line (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: v3-line

      - name: Build the 3.x documentation
        working-directory: v3-line
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter '!./examples/**'
          pnpm docs:build

      - name: Download existing Pages content
        id: existing-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: existing-pages
        # gh-pages does not exist on the very first deploy. A failure here is only
        # tolerable in that case; the guard below turns any other failure into an error
        # instead of silently publishing a site whose /v2 URLs all 404.
        continue-on-error: true

      - name: Merge existing + new docs
        run: |
          set -euo pipefail
          mkdir -p final-docs

          if [ -d "existing-pages" ]; then
            cp -r existing-pages/* final-docs/
            rm -rf final-docs/.git
          elif git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::error::gh-pages exists remotely but could not be checked out." \
                 "Refusing to publish, which would drop every previously published version."
            exit 1
          else
            echo "gh-pages does not exist yet - treating this as the first deploy."
          fi

          # Ensure v2 exists by moving the legacy TypeDoc root into /v2 once.
          if [ ! -d "final-docs/v2" ]; then
            mkdir -p final-docs/v2
            shopt -s dotglob
            for item in final-docs/*; do
              case "$(basename "$item")" in
                v2|v3|v4|llms.txt|llms-full.txt|CNAME|.nojekyll) continue;;
              esac
              mv "$item" final-docs/v2/
            done
            shopt -u dotglob
          fi

          # The 3.x line, built from main above.
          rm -rf final-docs/v3
          mkdir -p final-docs/v3
          cp -r v3-line/docs/dist/* final-docs/v3/

          # The 4.x line, built from this commit.
          rm -rf final-docs/v4
          mkdir -p final-docs/v4
          cp -r docs/dist/* final-docs/v4/

          # The site-root llms files stay the 3.x line's until GA.
          cp v3-line/llms.txt final-docs/llms.txt
          cp v3-line/llms-full.txt final-docs/llms-full.txt

          # Normalize the version selector in preserved static versions.
          node << 'NODE'
          const fs = require("node:fs")
          const path = require("node:path")

          const selectorHtml = `<select id="version-select" onchange="handleVersionChange(event)" aria-label="Select version">
                  <option value="v4">v4 (in development)</option>
                  <option value="v3">v3</option>
                  <option value="v2">v2</option>
                </select>`

          const patchScript = `<script id="ic-reactor-version-selector-patch">
                (function () {
                  var select = document.getElementById("version-select");
                  if (!select) return;
                  var match = window.location.pathname.match(/^\\/(v2|v3|v4)(\\/|$)/);
                  var currentVersion = match ? match[1] : "v3";
                  select.value = currentVersion;
                  select.addEventListener("change", function (event) {
                    var version = event.target.value;
                    var path = window.location.pathname || "/";
                    var nextPath = /^\\/v[234](\\/|$)/.test(path)
                      ? path.replace(/^\\/v[234](?=\\/|$)/, "/" + version)
                      : "/" + version + "/";
                    window.location.href = nextPath + window.location.search + window.location.hash;
                  });
                })();
              </script>`

          const linkRewrites = [
            ["https://ic-reactor.b3pay.net/ic-reactor/", "/v2/"],
            ["ic-reactor.b3pay.net/ic-reactor", "ic-reactor.b3pay.net/v2"],
            ["https://b3pay.github.io/ic-reactor/modules/core.html", "/v3/packages/core/"],
            ["https://b3pay.github.io/ic-reactor/modules/parser.html", "/v3/packages/parser/"],
            ["https://b3pay.github.io/ic-reactor/modules/react.html", "/v3/packages/react/"],
            ["https://b3pay.github.io/ic-reactor/modules/visitor.html", "/v3/packages/candid/"],
            ["https://b3pay.github.io/ic-reactor/", "/v3/"],
          ]

          function walk(dir) {
            if (!fs.existsSync(dir)) return []
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name)
              if (entry.isDirectory()) return walk(fullPath)
              return entry.isFile() && /\.(html|md|mdx)$/.test(entry.name)
                ? [fullPath]
                : []
            })
          }

          for (const file of walk("final-docs")) {
            let html = fs.readFileSync(file, "utf8")

            for (const [from, to] of linkRewrites) {
              html = html.split(from).join(to)
            }

            if (!html.includes('id="version-select"')) {
              fs.writeFileSync(file, html)
              continue
            }

            html = html.replace(
              /<select id="version-select"[\s\S]*?<\/select>/,
              selectorHtml
            )

            if (!html.includes("ic-reactor-version-selector-patch")) {
              html = html.replace("</body>", `${patchScript}\n            </body>`)
            }

            fs.writeFileSync(file, html)
          }
          NODE

          # Preserve CNAME for custom domain
          if [ -f "CNAME" ]; then
            cp CNAME final-docs/CNAME
          fi

          # Root redirect to the latest release's docs: v3 until 4.0 GA.
          cat > final-docs/index.html << 'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=/v3/" />
              <title>IC Reactor Docs</title>
              <script>
                window.location.replace("/v3/");
              </script>
            </head>
            <body>
              <p>Redirecting to v3 documentation…</p>
            </body>
          </html>
          EOF

          # Smart 404: redirect unknown routes to latest docs preserving path.
          # For versioned misses, fall back to a real root instead of leaving the
          # placeholder page visible forever.
          cat > final-docs/404.html << 'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8" />
              <title>Not Found</title>
              <script>
                (function () {
                  var path = window.location.pathname || "/";
                  if (path.startsWith("/v2")) {
                    window.location.replace("/v2/");
                    return;
                  }
                  if (path.startsWith("/v3")) {
                    window.location.replace("/v3/");
                    return;
                  }
                  if (path.startsWith("/v4")) {
                    window.location.replace("/v4/");
                    return;
                  }
                  window.location.replace("/v3" + path);
                })();
              </script>
            </head>
            <body>
              <p>Redirecting...</p>
            </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: final-docs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The only job that needs the Pages OIDC token; its sole step is
    # actions/deploy-pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
