name: Examples on the published packages

# The examples job of CI runs the examples inside the workspace, linked to the
# packages built from the branch. This runs each of them as someone who copies
# it out of the repository does, and as StackBlitz does: its tracked files in a
# directory outside the checkout, a plain `npm install` from the registry, the
# @ic-reactor/* packages at the version npm's `beta` dist-tag names, then its
# typecheck, test and build scripts and the start command of its
# .stackblitzrc (scripts/test-examples-published.mjs).
#
# On every pull request to v4, so a change that makes an example use an API the
# published beta lacks fails here. That is intended: such an example change
# lands with the release that publishes the API, not before it. Weekly, because
# the examples' other ranges (Vite, Next, TanStack Query, ...) resolve to new
# releases with no commit of ours. GitHub runs `schedule` and offers
# `workflow_dispatch` only for workflow files on the default branch, which is
# main (3.x) until 4.0 GA, so those two triggers start working when v4 becomes
# main.
on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples-published:
    name: Examples on the published beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The examples need Node 22.18 or later (node-agent-tool runs its .ts
      # files with Node's type stripping); 22 resolves to the newest 22.x.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # No `pnpm install`: the script needs only Node, npm and git, and the
      # examples get nothing from the workspace.
      - name: Test the examples against the published packages
        run: node scripts/test-examples-published.mjs
