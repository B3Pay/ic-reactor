name: Release

# The v4 line's release lane: @ic-reactor/core, @ic-reactor/react and
# @ic-reactor/vite-plugin in lockstep, prereleases only, from the v4 branch.
# A tag push runs the workflow file of the tagged commit, so 3.x tags on main
# keep main's lane.
on:
  push:
    tags:
      - "v4.*"

permissions:
  contents: read

concurrency:
  # Keyed per tag, NOT per lane. A shared group serialises publishes, but GitHub
  # keeps only ONE run pending per group: when a third run arrives, the run that
  # was already waiting is cancelled outright, silently dropping a release.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Nothing verified the commit a tag points at: ci.yml and e2e.yml have no `tags:`
  # trigger, so a tag could publish code that never passed a single check. This job
  # gates every publish leg.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Tag must be an ancestor of v4
        run: |
          set -euo pipefail
          git fetch --no-tags origin v4
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/v4; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/v4. Refusing to publish."
            exit 1
          fi

      # Until 4.0 GA the v4 line never publishes under `latest`, which would
      # replace 3.x for every plain install (DECISIONS Q15).
      - name: Tag must be a prerelease
        run: |
          set -euo pipefail
          REF="${GITHUB_REF##*/}"
          if [[ "$REF" != *-* ]]; then
            echo "::error::$REF is not a prerelease. The v4 branch publishes prereleases only, never under latest."
            exit 1
          fi

      - name: Tag version must match package manifests
        run: |
          set -euo pipefail
          REF="${GITHUB_REF##*/}"
          EXPECTED="${REF#v}"
          echo "Tag version: $EXPECTED"
          for pkg in packages/core packages/react packages/vite-plugin; do
            ACTUAL="$(node -p "require('./$pkg/package.json').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$pkg is at $ACTUAL but the tag says $EXPECTED."
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Build, type check and test
        run: |
          set -euo pipefail
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Verify published artifacts
        run: pnpm verify:packages

  # One approval for the whole release. The `npm-publish` environment carries a
  # required reviewer and a deployment tag policy (v*, tools-v*, parser-v*) in
  # repo settings. Preflight gates correctness and the `Release tags` ruleset
  # gates who can create the tag; this is the only gate on the publish itself.
  # npm versions are immutable, so a wrong publish can only be superseded.
  # Self-approval is allowed, so for a solo maintainer it is a confirmation
  # step, not a second-person requirement. Like preflight, it is read from the
  # tagged revision: the tag policy is the part that holds regardless.
  #
  # It is its own job rather than a key on `release` because the publish
  # matrix runs with max-parallel: 1, and an environment on a matrix job asks
  # for approval once per leg as each one starts -- three prompts for v*.
  approve:
    name: Approve publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    steps:
      - name: Approved
        run: echo "Publishing ${GITHUB_REF_NAME} was approved."

  release:
    needs: [preflight, approve]
    name: Release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        workspace:
          - packages/core
          - packages/react
          - packages/vite-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Upgrade npm to v11 (required for OIDC)
        run: npm i -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        # Install only this package and its dependency graph, keeping any
        # other workspace out of the release.
        run: pnpm install --frozen-lockfile --filter "{./${{ matrix.workspace }}}..."

      # Build this publishable package and the workspace packages it depends on.
      - name: Build package dependency graph
        run: pnpm -r --filter "{./${{ matrix.workspace }}}..." build

      - name: Run package tests
        run: pnpm --filter "{./${{ matrix.workspace }}}" test

      - name: Determine publish tag
        run: |
          # Prereleases go to `beta`. The v4 line has no `latest` until GA;
          # preflight already refused a tag without a hyphen, and this refuses
          # it again rather than fall back to `latest`.
          REF=${GITHUB_REF##*/}
          echo "Detected tag: $REF"
          if [[ "$REF" == *-* ]]; then
            echo "TAG=beta" >> $GITHUB_ENV
          else
            echo "::error::$REF is not a prerelease; refusing to publish under latest."
            exit 1
          fi

      - name: Publish to npm (uses npm CLI for OIDC)
        # pnpm pack converts workspace:^ to real versions, then npm publish for OIDC auth
        working-directory: ${{ matrix.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          # Pack first - this converts workspace:^ to actual versions
          TARBALL=$(pnpm pack | tail -1)
          if [ -z "$TARBALL" ] || [ ! -s "$TARBALL" ]; then
            echo "::error::pnpm pack produced no tarball; refusing to publish."
            exit 1
          fi
          echo "Publishing tarball: $TARBALL"
          # Publish the tarball (npm for OIDC support)
          npm publish "$TARBALL" --access public --tag "$TAG"

      - name: Create GitHub Release
        if: matrix.workspace == 'packages/core'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The examples against the packages this run just published, from the tagged
  # commit: the green run of examples-published.yml that counts for a release.
  # The release PR's own run of that workflow is expected to fail when its
  # examples use the API this release publishes.
  # The publish job's matrix runs one package at a time (core, react,
  # vite-plugin), so --wait-for waits for every one of them, not only core.
  examples-published:
    name: Examples on the published beta
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/examples-published.yml
    with:
      wait-for: ${{ github.ref_name }}
