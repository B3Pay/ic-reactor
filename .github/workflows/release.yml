name: Release

# The 4.x release lane: @ic-reactor/core, @ic-reactor/react and
# @ic-reactor/vite-plugin in lockstep, from main. A stable 4.x tag publishes
# under npm's `latest` dist-tag and becomes the latest GitHub Release; a 4.x
# prerelease publishes under `beta` (scripts/release-tag.mjs decides, for this
# workflow and scripts/release.js alike). A tag push runs the workflow file of
# the tagged commit, so 3.x tags (`v3.*`, `tools-v*`, `parser-v*`) on the v3
# branch run v3's own lanes, which never touch `latest` for core, react or
# vite-plugin.
on:
  push:
    tags:
      - "v4.*"

permissions:
  contents: read

concurrency:
  # Keyed per tag, NOT per lane. A shared group serialises publishes, but GitHub
  # keeps only ONE run pending per group: when a third run arrives, the run that
  # was already waiting is cancelled outright, silently dropping a release.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Nothing verified the commit a tag points at: ci.yml and e2e.yml have no `tags:`
  # trigger, so a tag could publish code that never passed a single check. This job
  # gates every publish leg.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dist_tag: ${{ steps.tag.outputs.dist_tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      make_latest: ${{ steps.tag.outputs.make_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Tag must be an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Refusing to publish."
            exit 1
          fi

      # A 4.x version only: a stable one goes to `latest`, a prerelease to
      # `beta`. Anything else (a 3.x or 5.x tag, a tag that is not semver)
      # fails here, before the build, and publishes nothing.
      - name: Tag must be a 4.x version
        id: tag
        run: |
          set -euo pipefail
          node scripts/release-tag.mjs "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: Tag version must match package manifests
        env:
          EXPECTED: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "Tag version: $EXPECTED"
          for pkg in packages/core packages/react packages/vite-plugin; do
            ACTUAL="$(node -p "require('./$pkg/package.json').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$pkg is at $ACTUAL but the tag says $EXPECTED."
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Build, type check and test
        run: |
          set -euo pipefail
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Verify published artifacts
        run: pnpm verify:packages

  # One approval for the whole release. The `npm-publish` environment carries a
  # required reviewer and a deployment tag policy (v*, tools-v*, parser-v*) in
  # repo settings. Preflight gates correctness and the `Release tags` ruleset
  # gates who can create the tag; this is the only gate on the publish itself.
  # npm versions are immutable, so a wrong publish can only be superseded.
  # Self-approval is allowed, so for a solo maintainer it is a confirmation
  # step, not a second-person requirement. Like preflight, it is read from the
  # tagged revision: the tag policy is the part that holds regardless.
  #
  # It is its own job rather than a key on `release` because the publish
  # matrix runs with max-parallel: 1, and an environment on a matrix job asks
  # for approval once per leg as each one starts -- three prompts for v*.
  approve:
    name: Approve publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    steps:
      - name: Approved
        run: echo "Publishing ${GITHUB_REF_NAME} was approved."

  release:
    needs: [preflight, approve]
    name: Release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        workspace:
          - packages/core
          - packages/react
          - packages/vite-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Upgrade npm to v11 (required for OIDC)
        run: npm i -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        # Install only this package and its dependency graph, keeping any
        # other workspace out of the release.
        run: pnpm install --frozen-lockfile --filter "{./${{ matrix.workspace }}}..."

      # Build this publishable package and the workspace packages it depends on.
      - name: Build package dependency graph
        run: pnpm -r --filter "{./${{ matrix.workspace }}}..." build

      - name: Run package tests
        run: pnpm --filter "{./${{ matrix.workspace }}}" test

      - name: Publish to npm (uses npm CLI for OIDC)
        # pnpm pack converts workspace:^ to real versions, then npm publish for OIDC auth
        working-directory: ${{ matrix.workspace }}
        shell: bash
        env:
          # Decided once, by preflight (scripts/release-tag.mjs).
          TAG: ${{ needs.preflight.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Always an explicit --tag: an empty one would let npm fall back to
          # `latest` for any version.
          case "$TAG" in
            latest | beta) echo "Publishing under the $TAG dist-tag." ;;
            *)
              echo "::error::Preflight gave no dist-tag ('$TAG'); refusing to publish."
              exit 1
              ;;
          esac
          # Pack first - this converts workspace:^ to actual versions
          TARBALL=$(pnpm pack | tail -1)
          if [ -z "$TARBALL" ] || [ ! -s "$TARBALL" ]; then
            echo "::error::pnpm pack produced no tarball; refusing to publish."
            exit 1
          fi
          echo "Publishing tarball: $TARBALL"
          # Publish the tarball (npm for OIDC support)
          npm publish "$TARBALL" --access public --tag "$TAG"

      - name: Create GitHub Release
        if: matrix.workspace == 'packages/core'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          # The "Latest" badge goes to a stable 4.x release only, never to a
          # prerelease (and v3's lanes set it to false).
          make_latest: ${{ needs.preflight.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
