name: Release

on:
  push:
    tags:
      - "v[1-9]*"

permissions:
  contents: read

concurrency:
  # Keyed per tag, NOT per lane. A shared group serialises publishes, but GitHub
  # keeps only ONE run pending per group: when a third run arrives, the run that
  # was already waiting is cancelled outright. Pushing parser-v*, tools-v* and v*
  # back to back therefore silently dropped the middle release.
  #
  # Ordering across lanes is enforced where it actually matters instead -- the
  # release-tools matrix publishes parser before its dependents with
  # max-parallel: 1 and fail-fast: true, and codegen's pinned parser version is
  # asserted to exist on npm before it publishes.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Nothing verified the commit a tag points at: ci.yml and e2e.yml have no `tags:`
  # trigger, so a tag could publish code that never passed a single check. This job
  # gates every publish leg.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Tag must be an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Refusing to publish."
            exit 1
          fi

      - name: Tag version must match package manifests
        run: |
          set -euo pipefail
          REF="${GITHUB_REF##*/}"
          EXPECTED="${REF#v}"
          echo "Tag version: $EXPECTED"
          for pkg in packages/core packages/react packages/candid; do
            ACTUAL="$(node -p "require('./$pkg/package.json').version")"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$pkg is at $ACTUAL but the tag says $EXPECTED."
              exit 1
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '!./examples/**'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build, type check and test
        run: |
          set -euo pipefail
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Verify published artifacts
        run: pnpm verify:packages

  release:
    needs: preflight
    name: Release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every publish leg deploys to the `npm-publish` environment, which carries a
    # required reviewer and a deployment tag policy (v*, tools-v*, parser-v*) in
    # repo settings. Preflight gates correctness and the `Release tags` ruleset
    # gates who can create the tag; this is the only gate on the publish itself.
    # npm versions are immutable, so a wrong publish can only be superseded.
    # Self-approval is allowed, so for a solo maintainer it is a confirmation
    # step, not a second-person requirement. Like preflight, it is read from the
    # tagged revision: the tag policy is the part that holds regardless.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        workspace:
          - packages/core
          - packages/react
          - packages/candid
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Upgrade npm to v11 (required for OIDC)
        run: npm i -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        # Install only this v3 package and its dependency graph, keeping any
        # unreleased workspaces out of v3 tags.
        run: pnpm install --frozen-lockfile --filter "{./${{ matrix.workspace }}}..."

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/parser/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/parser/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # parser is released separately via the release-tools workflow, so we don't need to
      # build it here. keeping this step slows down the job.

      # Build this publishable package and the workspace packages it depends on.
      - name: Build package dependency graph
        run: pnpm -r --filter "{./${{ matrix.workspace }}}..." build

      - name: Run package tests
        run: pnpm --filter "{./${{ matrix.workspace }}}" test

      - name: Determine publish tag
        run: |
          # Determine publish tag based on the git tag name.
          # Default to 'latest' for stable tags (e.g., v3.0.0). If tag contains a hyphen (e.g., v3.0.0-beta.1), use 'beta'.
          REF=${GITHUB_REF##*/}
          echo "Detected tag: $REF"
          if [[ "$REF" == *-* ]]; then
            echo "TAG=beta" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      - name: Publish to npm (uses npm CLI for OIDC)
        # pnpm pack converts workspace:^ to real versions, then npm publish for OIDC auth
        working-directory: ${{ matrix.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          # Pack first - this converts workspace:^ to actual versions
          TARBALL=$(pnpm pack | tail -1)
          if [ -z "$TARBALL" ] || [ ! -s "$TARBALL" ]; then
            echo "::error::pnpm pack produced no tarball; refusing to publish."
            exit 1
          fi
          echo "Publishing tarball: $TARBALL"
          # Publish the tarball (npm for OIDC support)
          npm publish "$TARBALL" --access public --tag "$TAG"

      - name: Create GitHub Release
        if: matrix.workspace == 'packages/core'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
