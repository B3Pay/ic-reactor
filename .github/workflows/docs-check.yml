name: Docs validation (PR)

on:
  pull_request:
    paths:
      - "docs/**"
      - "packages/**"
      - "packages/**/src/content/**"
      # check-example-docs.mjs validates the docs against the examples/ tree, so
      # renaming an example file can break a page without touching docs/.
      - "examples/**"

permissions:
  contents: read

jobs:
  # The pages link Candid Core's site, which the deploy serves at
  # /candid-core/ from that repository's main, built in a job of its own
  # (docs.yml, `candid-core-site`); the link check mounts the same build here.
  candid-core-site:
    name: Build Candid Core's site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: B3Pay/Meant
          ref: main
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
      - name: Build
        run: |
          set -euo pipefail
          node website/build.mjs
          echo "Candid Core's site is built from B3Pay/Meant@$(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candid-core-site
          path: website/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Runs when Candid Core's site does not build, too, so the lint and the
  # build still report; the link check then fails, for want of the site.
  validate-docs:
    name: MDX lint + docs build
    needs: candid-core-site
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm --version
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: MDX lint
        working-directory: ./docs
        run: pnpm run lint:mdx
      # Needs no build. Running it first fails a broken example link in seconds
      # rather than after the full docs build.
      - name: Check example docs
        run: pnpm docs:check-examples
      - name: Build docs
        run: pnpm docs:build

      - name: Download Candid Core's site
        if: needs.candid-core-site.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candid-core-site
          path: candid-core-site

      - name: Check links
        env:
          CANDID_CORE_SITE: ${{ github.workspace }}/candid-core-site
        run: pnpm docs:check-links
