version: 2

updates:
  # Maintain dependencies for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates together
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Keep major updates separate for careful review
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # TypeScript 7 is the native Go port, and its npm package does not ship the
      # compiler API (`exports["."]` is `lib/version.cjs`; `ts.createProgram` is
      # undefined). `tsup --dts` crashes inside rollup-plugin-dts, which breaks the
      # vite-plugin build. The type system itself is ready -- tsc 7 checks every
      # package with zero errors -- so this unblocks once vite-plugin moves off
      # `tsup --dts`, or tsup gains TS7 support. See #225.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "automated"

  # Rust crates of the e2e hello_actor canister. packages/parser, which this
  # entry used to cover, is on the v3 branch only. Dependabot reads this file
  # from the default branch (main) and opens pull requests against main only:
  # the v3 branch gets no Dependabot pull requests, and its dependency-review
  # job's audit is its advisory check.
  - package-ecosystem: "cargo"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(e2e)"
    labels:
      - "dependencies"
      - "automated"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # CodeQL's init, autobuild and analyze steps must run the same release.
      # Dependabot names each path as its own dependency, so without this group
      # it opens three PRs, and each one fails its CodeQL check with "Loaded a
      # configuration file for version X, but running version Y". #323 and #375
      # had to replace such a trio by hand.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"

  # The `github-actions` entry above uses `directory: "/"`, which covers
  # `.github/workflows/**` but does NOT descend into `.github/actions/**`.
  # Without this entry the two SHAs inside the setup-rust-wasm composite would be
  # the only unmaintained action pins in a repo whose convention is that every
  # action is SHA-pinned.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-rust-wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
