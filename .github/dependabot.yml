version: 2

updates:
  # Maintain dependencies for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # icp-cli and ic-wasm are each pinned twice: in package.json, and in
      # e2e.yml (ICP_CLI_VERSION, IC_WASM_VERSION), where "E2E Tests" stops when
      # the two differ. Dependabot edits only package.json, so its bump of
      # either one fails that check every time. In the grouped pull request it
      # held back every other bump with it (#1091). In a pull request of their
      # own the failed check says a new release is out, and the pins, the
      # `$schema` lines and the docs that name the release then move together
      # by hand, as #1101 did. The two groups below leave these packages out,
      # so this is the only group they can join.
      icp-tools:
        patterns:
          - "@icp-sdk/icp-cli"
          - "@icp-sdk/ic-wasm"
      # Group minor and patch updates together
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@icp-sdk/icp-cli"
          - "@icp-sdk/ic-wasm"
        update-types:
          - "minor"
          - "patch"
      # Keep major updates separate for careful review
      major:
        patterns:
          - "*"
        exclude-patterns:
          - "@icp-sdk/icp-cli"
          - "@icp-sdk/ic-wasm"
        update-types:
          - "major"
    ignore:
      # TypeScript 7 is the native Go port, and its npm package does not ship the
      # compiler API (`exports["."]` is `lib/version.cjs`; `ts.createProgram` is
      # undefined). `tsup --dts` crashes inside rollup-plugin-dts, which breaks the
      # vite-plugin build. The type system itself is ready -- tsc 7 checks every
      # package with zero errors -- so this unblocks once vite-plugin moves off
      # `tsup --dts`, or tsup gains TS7 support. See #225.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # jsdom 31 reads the global `Iterator` while it loads
      # (`lib/jsdom/living/helpers/dom-tree.js`). "Examples on the published
      # packages" starts each example under a model of what StackBlitz's
      # WebContainer lacks, and that model has no global `Iterator`
      # (WEBCONTAINER_MODEL in scripts/test-examples-published.mjs). With jsdom
      # 31 that step fails for vite-wallet and next-ssr, whose tests stop with
      # "ReferenceError: Iterator is not defined" (#1075). Every other check
      # passes on jsdom 31. This unblocks when a WebContainer has the global
      # and the model stops removing it.
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # size-limit 14 bundles with rolldown where 13 bundles with esbuild, so
      # the measured sizes move while the packages stay the same: on #1075 the
      # two app checks came out 722 B and 398 B over their limits. Each limit
      # sits just above what 13 measures (CONTRIBUTING.md, "Size budget"), so
      # moving to 14 means setting the four limits again, in a pull request of
      # its own.
      - dependency-name: "size-limit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@size-limit/preset-small-lib"
        update-types: ["version-update:semver-major"]
      # stack.json chooses the Meant release, and `pnpm sync:stack` moves
      # every pin together (CONTRIBUTING.md, "The Meant pins"). A bump of one
      # package.json would fail `pnpm check:stack`, and in the grouped pull
      # request it would hold back every other bump with it.
      - dependency-name: "@meantjs/schema"
      - dependency-name: "@meantjs/cli"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "automated"

  # Rust crates of the e2e hello_actor canister. packages/parser, which this
  # entry used to cover, is on the v3 branch only. Dependabot reads this file
  # from the default branch (main) and opens pull requests against main only:
  # the v3 branch gets no Dependabot pull requests, and its dependency-review
  # job's audit is its advisory check.
  - package-ecosystem: "cargo"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(e2e)"
    labels:
      - "dependencies"
      - "automated"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # CodeQL's init, autobuild and analyze steps must run the same release.
      # Dependabot names each path as its own dependency, so without this group
      # it opens three PRs, and each one fails its CodeQL check with "Loaded a
      # configuration file for version X, but running version Y". #323 and #375
      # had to replace such a trio by hand.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"

  # The `github-actions` entry above uses `directory: "/"`, which covers
  # `.github/workflows/**` but does NOT descend into `.github/actions/**`.
  # Without this entry the two SHAs inside the setup-rust-wasm composite would be
  # the only unmaintained action pins in a repo whose convention is that every
  # action is SHA-pinned.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-rust-wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
