version: 2

updates:
  # Maintain dependencies for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates together
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Keep major updates separate for careful review
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # TypeScript 7 is the native Go port, and its npm package does not ship the
      # compiler API (`exports["."]` is `lib/version.cjs`; `ts.createProgram` is
      # undefined). `tsup --dts` crashes inside rollup-plugin-dts, which breaks the
      # cli, codegen and vite-plugin builds. The type system itself is ready --
      # tsc 7 checks every package with zero errors -- so this unblocks once those
      # three move off `tsup --dts`, or tsup gains TS7 support. See #225.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # An npm alias that keeps @icp-sdk/auth v8 installed next to the v10
      # devDependency, so react's real-AuthClient suite runs against both
      # supported majors (packages/react/vitest.config.ts). Moving it to v10
      # would silently drop the v8 run.
      - dependency-name: "@icp-sdk/auth-v8"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "automated"

  # Rust crates behind @ic-reactor/parser. This ecosystem had no coverage at all:
  # candid_parser, wasm-bindgen and serde received neither update PRs nor advisory
  # alerts, and packages/parser is the one component that parses untrusted .did
  # input.
  - package-ecosystem: "cargo"
    directory: "/packages/parser"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(parser)"
    labels:
      - "dependencies"
      - "automated"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # CodeQL's init, autobuild and analyze steps must run the same release.
      # Dependabot names each path as its own dependency, so without this group
      # it opens three PRs, and each one fails its CodeQL check with "Loaded a
      # configuration file for version X, but running version Y". #323 and #375
      # had to replace such a trio by hand.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"

  # The `github-actions` entry above uses `directory: "/"`, which covers
  # `.github/workflows/**` but does NOT descend into `.github/actions/**`.
  # Without this entry the two SHAs inside the setup-rust-wasm composite would be
  # the only unmaintained action pins in a repo whose convention is that every
  # action is SHA-pinned.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-rust-wasm"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
