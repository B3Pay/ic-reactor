name: "Setup Rust for the e2e canister build"
description: >-
  Installs the stable Rust toolchain with the wasm32-unknown-unknown target and
  restores the cargo cache of the e2e hello_actor canister, which `icp deploy`
  builds in e2e.yml. On the v4 line no package build needs Rust; the parser's
  wasm-pack build that used to share this action is deleted there.

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          e2e/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('e2e/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
